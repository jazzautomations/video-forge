<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#101710;color:#F3F1E9;font-family:Arial,sans-serif}#intro{position:relative;width:1920px;height:1080px;overflow:hidden;background:#101710}.grid{position:absolute;inset:0;background-image:linear-gradient(#d7ff6414 1px,transparent 1px),linear-gradient(90deg,#d7ff6414 1px,transparent 1px);background-size:90px 90px;opacity:.45}.content{width:100%;height:100%;padding:100px 130px;display:flex;flex-direction:column;justify-content:center;gap:25px}.label{font:24px monospace;letter-spacing:7px;color:#D7FF64}.line{overflow:hidden}h1{font-size:190px;letter-spacing:-12px;line-height:1;margin:0;max-width:1600px}h1 span{color:#D7FF64}.rule{width:1450px;height:5px;background:#D7FF64;transform-origin:left}.sub{font-size:35px;max-width:1500px;color:#CED1C5}.number{position:absolute;right:130px;bottom:95px;font:24px monospace;color:#D7FF64}

</div><script src="node_modules/gsap/dist/gsap.min.js"></script><script>
